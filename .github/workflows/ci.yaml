name: CI

on: [push, pull_request]

jobs:
  CI:
    name: Launching CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development dependencies
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --dev

      - name: Check code quality
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

      - name: Test training and saved predictions
        run: uv run --locked python -m unittest discover -s tests

      - name: Build API container
        run: docker build -f Dockerfile.app -t abalone-api:ci .

      - name: Create offline model fixture and start container
        run: |
          uv run --locked python -m tests.fixtures src/web_service/local_objects/model.pkl
          docker run -d --name abalone-api-ci -p 127.0.0.1:8000:8001 \
            --mount type=bind,source="$PWD/src/web_service/local_objects",target=/app/src/web_service/local_objects,readonly \
            abalone-api:ci

      - name: Verify container predictions and validation
        run: uv run --locked python -m scripts.smoke_api

      - name: Install browser test dependencies
        run: uv run --locked --group browser playwright install --with-deps chromium

      - name: Exercise prediction interface in Chromium
        run: uv run --locked --group browser python -m scripts.check_ui

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs abalone-api-ci || true
          docker rm -f abalone-api-ci || true
