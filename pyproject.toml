[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Andreea Patarlageanu", email = "andreea.patarlageanu@hec.edu" },
  { name = "Remi Laget", email = "remi.laget@hec.edu" },
  { name = "Oliver Smith", email = "oliver.smith@hec.edu" },
  { name = "Ryan Balech", email = "ryan.balech@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.11"

dependencies = [
  "pydantic>=2,<3",
  "numpy",
  "pandas",
  "scikit-learn",
  "prefect>=3.9.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
browser = [
  "playwright>=1.56,<2",
]
dev = [
  "pre-commit>=4,<5",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]
notebook = [
  "ipykernel",
  "kagglehub>=1.0.3",
  "matplotlib",
  "mlflow>=3.17.2",
  "numpy",
  "pandas",
  "scikit-learn",
  "seaborn",
]

[tool.uv]
package = false
